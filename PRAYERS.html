    { title: "When Distressed", arabic: "حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ", english: "Allah is sufficient for us and He is the best Disposer of affairs.", urdu: "اللہ ہمارے لیے کافی ہے اور وہ بہترین کارساز ہے۔" },
    { title: "For Body Pain", arabic: "أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ", english: "I seek refuge in Allah and His power from the evil I feel.", urdu: "میں اللہ اور اس کی قدرت کی پناہ مانگتا ہوں اس برائی سے جو میں محسوس کرتا ہوں۔" },
    { title: "Visiting Sick", arabic: "لَا بَأْسَ طَهُورٌ إِنْ شَاءَ اللَّهُ", english: "No need to worry, it is a purification if Allah wills.", urdu: "کوئی بات نہیں، یہ گناہوں سے پاکی ہے، اگر اللہ نے چاہا۔" },

    { title: "Evening Dua", arabic: "أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ", english: "We have reached the evening and at this very time the whole Kingdom belongs to Allah.", urdu: "ہم نے شام کی اور شام ہی کے وقت تمام بادشاہی اللہ کے لیے ثابت رہی۔" },
    { title: "Dua-e-Istikhara", arabic: "اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ", english: "O Allah, I seek the counsel of Your knowledge and I seek help from Your omnipotence.", urdu: "اے اللہ! میں تیرے علم کے ذریعے تجھ سے خیر طلب کرتا ہوں اور تیری قدرت کے ذریعے قدرت مانگتا ہوں۔" },
    { title: "Meeting Muslim", arabic: "السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ", english: "May the peace, mercy, and blessings of Allah be upon you.", urdu: "تم پر سلامتی ہو اور اللہ کی رحمت اور اس کی برکتیں۔" },
    { title: "Returning Salam", arabic: "وَعَلَيْكُمُ السَّلَامُ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ", english: "And upon you be peace, mercy, and blessings of Allah.", urdu: "اور تم پر بھی سلامتی ہو اور اللہ کی رحمت اور اس کی برکتیں۔" },
    { title: "Thanking Someone", arabic: "جَزَاكَ اللَّهُ خَيْرًا", english: "May Allah reward you with goodness.", urdu: "اللہ آپ کو بہترین بدلہ عطا فرمائے۔" },

];

function initializeRegistry() {
    const reg = document.getElementById('registry');
    duaData.forEach((dua, index) => {
        const btn = document.createElement('button');
        btn.className = 'dua-btn';
        btn.innerHTML = `<span class="num">${index + 1}</span> <span>${dua.title.toUpperCase()}</span>`;
        btn.onclick = () => loadDua(index, btn);
        reg.appendChild(btn);
    });
    if(duaData.length > 0) loadDua(0, reg.firstChild);
}

function loadDua(index, btn) {
    const data = duaData[index];
    const arabic = document.getElementById('arabic-display');
    const english = document.getElementById('english-display');
    const urdu = document.getElementById('urdu-display');
    const isTestMode = document.getElementById('testModeToggle').checked;

    document.querySelectorAll('.dua-btn').forEach(b => b.classList.remove('active-dua'));
    btn.classList.add('active-dua');

    [arabic, english, urdu].forEach(el => el.style.opacity = '0');
    
    setTimeout(() => {
        arabic.innerText = data.arabic;
        english.innerText = data.english;
        urdu.innerText = data.urdu;
        
        arabic.style.opacity = '1';
        if (!isTestMode) {
            english.style.opacity = '1';
            urdu.style.opacity = '1';
        } else {
            english.style.opacity = '0';
            urdu.style.opacity = '0';
        }
        
        document.getElementById('live-txt').innerText = isTestMode ? "tESTING: " + data.title : "ACTIVE: " + data.title;
    }, 200);
}

function toggleTestMode() {
    const isTestMode = document.getElementById('testModeToggle').checked;
    const boxes = document.querySelectorAll('.translation-box');
    const liveTxt = document.getElementById('live-txt');

    boxes.forEach(box => {
        if (isTestMode) {
            box.style.filter = 'blur(30px)';
            box.style.opacity = '0';
        } else {
            box.style.filter = 'none';
            box.style.opacity = '1';
        }
    });

    liveTxt.innerText = isTestMode ? "SYSTEM: tEST MODE ACTIVE" : "SYSTEM: ACTIVE";
    liveTxt.className = isTestMode ? "text-warning small fw-bold me-4" : "text-success small fw-bold me-4";
}

document.addEventListener('contextmenu', e => e.preventDefault());
window.onload = initializeRegistry;
</script>

</html>
