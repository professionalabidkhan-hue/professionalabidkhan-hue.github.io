    <style>
        /* START: UI Repairing (Part 6) - Global Sovereign CSS */
        :root {
            --islamic-green: #00c853;
            --dark-bg: #030407;
            --gold: #FFD700;
            --cyber-cyan: #00d4ff;
            --glass-white: rgba(255, 255, 255, 0.05);
        }

        body { 
            background-color: var(--dark-bg); color: #fff; 
            font-family: 'Inter', sans-serif; -webkit-user-select: none; user-select: none;
            overflow-x: hidden;
        }

        .android-home-btn {
            position: fixed; bottom: 30px; right: 30px; z-index: 10001;
            background: linear-gradient(135deg, var(--gold), #b8860b);
            color: #000; width: 65px; height: 65px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4); text-decoration: none;
            font-size: 1.8rem; border: 2px solid #fff; transition: 0.3s;
        }
        .android-home-btn:hover { transform: scale(1.1) rotate(360deg); color: #000; }

        .navbar-custom {
            background: rgba(3, 4, 7, 0.98); border-bottom: 3px solid var(--islamic-green);
            padding: 15px 0; backdrop-filter: blur(10px);
        }
        .nav-link { font-family: 'Orbitron'; color: #fff !important; text-transform: uppercase; font-size: 0.8rem; }
        .nav-link:hover { color: var(--gold) !important; }

        /* Unified Slider Interface */
        .qaida-box {
            background: radial-gradient(circle, #0a1f12 0%, #030407 100%);
            border: 2px solid rgba(0, 200, 83, 0.3); border-radius: 25px; padding: 40px; margin-top: 30px;
        }
        .img-container {
            background: #fff; padding: 15px; border-radius: 15px; 
            display: inline-block; box-shadow: 0 0 30px rgba(0, 200, 83, 0.4);
            transition: 0.4s ease; min-width: 320px;
        }
        #qaida-display { 
            will-change: transform, opacity; transition: 0.4s; 
            max-width: 100%; height: auto; max-height: 70vh;
            image-rendering: -webkit-optimize-contrast;
        }

        /* Sovereign Glow Cards */
        .gallery-card {
            background: var(--glass-white); border: 1px solid rgba(0, 200, 83, 0.2);
            border-radius: 20px; padding: 30px; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer; position: relative; overflow: hidden; height: 100%;
            text-decoration: none; display: block;
        }
        .gallery-card:hover {
            transform: translateY(-15px); border-color: var(--gold);
            background: rgba(255, 215, 0, 0.05); box-shadow: 0 15px 40px rgba(0, 200, 83, 0.2);
        }
        .gallery-card i { font-size: 3.5rem; color: var(--islamic-green); transition: 0.5s; }
        .gallery-card:hover i { color: var(--gold); transform: scale(1.2) rotate(10deg); }
        .card-title { font-family: 'Orbitron'; color: #fff; margin-top: 15px; font-size: 1.2rem; }

        /* tEST Mode Visuals */
        .test-mode-on .meaning-text { filter: blur(12px); color: transparent; background: rgba(0, 212, 255, 0.1); }
        .test-mode-on .meaning-text:hover { filter: blur(0px); color: var(--gold); }
        .meaning-text { transition: 0.4s; padding: 2px 8px; border-radius: 4px; display: inline-block; }

        .footer-elite { background: #000; border-top: 2px solid var(--islamic-green); padding: 50px 0; margin-top: 80px; }
        .btn-nav { background: var(--islamic-green); color: white; width: 60px; height: 60px; border-radius: 50%; border: none; transition: 0.3s; }
        .btn-nav:hover { background: var(--gold); transform: scale(1.1); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        /* END: UI Repairing */
    </style>
</head>

<div class="container py-5">
    <div class="qaida-box text-center mb-5">
        <h1 id="gallery-title" class="display-5 fw-bold mb-4" style="font-family:'Orbitron'; color: var(--gold);">NOORANI QAEEDHA</h1>
        <div class="img-container">
            <img id="qaida-display" src="" alt="Learning Page">
        </div>
        
        <div class="mt-4 d-flex justify-content-center align-items-center gap-4">
            <button class="btn-nav" onclick="changeImage(-1)"><i class="fas fa-chevron-left"></i></button>
            <div class="h4 mb-0" style="font-family:'Orbitron'; min-width: 140px; color: var(--cyber-cyan);">PAGE: <span id="page-num">1</span></div>
            <button class="btn-nav" onclick="changeImage(1)"><i class="fas fa-chevron-right"></i></button>
        </div>

        <div class="mt-4">
            <input type="number" id="jump-input" class="py-2 px-3 border-0 rounded text-center" style="background:var(--glass-white); color:var(--gold); width:80px;" placeholder="GO" onchange="jumpToPage(this.value)">
            <button id="test-btn" class="btn btn-outline-info ms-3 px-4" onclick="toggleTestMode()">tEST Mode: OFF</button>
        </div>

    <div class="row g-4 mt-5">
        <div class="col-md-3">
            <div class="gallery-card text-center" onclick="loadGallery('qaeedha')">

</div>

        <div class="text-gold small" style="font-family:'Orbitron';">© 2026 PROFESSOR DR. ABID KHAN</div>

<script>
/* START: SOVEREIGN ENGINE */
const galleryData = {
    qaeedha: {
        title: "NOORANI QAEEDHA",
        baseUrl: "https://archive.org/download/noorani-qaida_202104/page/n",
        suffix: "_w600.jpg",
        total: 30
    },
    nimaz: {
        title: "NIMAZ (SALAH) GUIDE",
        images: [
            "https://blogger.googleusercontent.com/img/b/example-salah-1", // Add your direct URLs
            "https://blogger.googleusercontent.com/img/b/example-salah-2"
        ],
        total: 2
    }
};

let currentCat = 'qaeedha';
let currentIndex = 0;

function loadGallery(cat) {
    currentCat = cat;
    currentIndex = 0;
    document.getElementById('gallery-title').innerText = galleryData[cat].title;
    updateDisplay();
}

function updateDisplay() {
    const img = document.getElementById('qaida-display');
    img.style.opacity = '0';
    
    let source = "";
    if(galleryData[currentCat].baseUrl) {
        source = `${galleryData[currentCat].baseUrl}${currentIndex}${galleryData[currentCat].suffix}`;
    } else {
        source = galleryData[currentCat].images[currentIndex];
    }
    
    img.src = source;
    document.getElementById('page-num').innerText = currentIndex + 1;
    img.onload = () => { img.style.opacity = '1'; };
}

function changeImage(step) {
    const total = galleryData[currentCat].total;
    if(currentIndex + step >= 0 && currentIndex + step < total) {
        currentIndex += step;
        updateDisplay();
    }
}

function jumpToPage(val) {
    let p = parseInt(val) - 1;
    if(p >= 0 && p < galleryData[currentCat].total) {
        currentIndex = p;
        updateDisplay();
    }
}

function toggleTestMode() {
    const b = document.getElementById('test-btn');
    document.body.classList.toggle('test-mode-on');
    b.innerText = document.body.classList.contains('test-mode-on') ? "tEST Mode: ON" : "tEST Mode: OFF";
    if(document.body.classList.contains('test-mode-on')) {
        window.open("https://gemini.google.com/share/3dff81f93382", "_blank");
    }
}

// LIVE Status
const sys = ["ACTIVE", "SECURE", "abid-khan-institute-hub", "OPTIMIZED"];
let si = 0;
setInterval(() => {
    document.getElementById('live-txt').innerText = "SYSTEM: " + sys[si];
    si = (si + 1) % sys.length;
}, 3000);

window.onload = () => loadGallery('qaeedha');
/* END: SOVEREIGN ENGINE */
</script>
