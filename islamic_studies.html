<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic Studies | Professor Abid Khan Hub</title>
    
    <link rel="icon" type="image/png" href="ABID KHAN.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@600;800&display=swap" rel="stylesheet">

    <style>
        /* START: UI Repairing - Global Elite Styling */
        :root {
            --primary-blue: #0b63d3;
            --cyber-cyan: #00d4ff;
            --islamic-green: #00c853;
            --dark-bg: #030407;
            --gold: #FFD700;
        }

        body { 
            background-color: var(--dark-bg); 
            color: #fff; 
            font-family: 'Inter', sans-serif;
            -webkit-user-select: none; user-select: none;
            overflow-x: hidden;
        }

        /* 6. UI Repairing (Slider Performance & Visuals) */
        #qaida-display { 
            will-change: opacity; 
            transition: opacity 0.25s ease-in-out; 
            image-rendering: -webkit-optimize-contrast; 
            min-height: 500px; 
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 200, 83, 0.2);
        }

        .jump-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--islamic-green);
            color: var(--gold);
            border-radius: 5px;
            text-align: center;
            width: 80px;
            font-family: 'Orbitron';
        }

        /* Navbar Enhancements */
        .navbar-custom {
            background: rgba(3, 4, 7, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 3px solid var(--islamic-green);
            padding: 15px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .qaida-box {
            background: radial-gradient(circle, #0a1f12 0%, #030407 100%);
            border: 2px solid rgba(0, 200, 83, 0.3);
            border-radius: 25px;
            padding: 30px;
            margin-top: 50px;
        }

        .book-frame {
            background: #fff;
            border: 10px solid #1a1a1a;
            border-radius: 15px;
            max-width: 650px;
            margin: 0 auto;
        }

        .btn-nav {
            background: var(--islamic-green);
            color: white;
            border: none;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            transition: 0.3s;
        }

        .btn-nav:hover { background: var(--gold); color: #000; transform: scale(1.1); }
        .btn-nav:active { transform: scale(0.9); background: var(--cyber-cyan) !important; }
        
        .course-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 200, 83, 0.2);
            border-radius: 15px;
            transition: 0.3s;
        }
        /* END: UI Repairing */
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
            <img src="ABID KHAN.png" width="50" height="50" class="rounded-circle me-3" style="border: 2px solid var(--gold);">
            <span style="font-family:'Orbitron';">ABID KHAN HUB</span>
        </a>
        <div id="live-txt" class="ms-auto text-success fw-bold d-none d-md-block" style="font-family:'Orbitron'; font-size: 0.8rem;">
            SYSTEM: INITIALIZING...
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="display-4 fw-bold" style="font-family:'Orbitron'; color: var(--gold);">ISLAMIC STUDIES PORTAL</h1>
        <p class="text-secondary">Official Pedagogy Hub of Professor Doctor Abid Khan</p>
    </div>

    <div class="qaida-box text-center">
        <h3 class="mb-4" style="color: var(--islamic-green);">Digital Noorani Qaida</h3>
        <div class="book-frame">
            <img id="qaida-display" src="https://archive.org/download/noorani-qaida_202104/page/n0_w600.jpg" class="img-fluid">
        </div>
        
        <div class="mt-4">
            <div class="d-flex justify-content-center align-items-center gap-4">
                <button class="btn-nav" onclick="changePage(-1)"><i class="fas fa-arrow-left"></i></button>
                <div class="h5 mb-0" style="font-family:'Orbitron'; min-width: 100px;">PAGE: <span id="page-num">1</span></div>
                <button class="btn-nav" onclick="changePage(1)"><i class="fas fa-arrow-right"></i></button>
            </div>
            
            <div class="mt-3">
                <span class="small text-secondary me-2">JUMP TO:</span>
                <input type="number" id="jump-input" class="jump-box px-2" placeholder="No." onchange="jumpToPage(this.value)">
            </div>
        </div>
    </div>
</div>

<script>
/* START: JavaScript Logic - Optimized Hub Slider */

let currentPage = 0; 
const totalPages = 30; // 31 pages total (0-30)

const imgElement = document.getElementById('qaida-display');
const pageDisplay = document.getElementById('page-num');
const liveTxt = document.getElementById('live-txt');

// 1. NAVIGATION LOGIC
function updateDisplay() {
    imgElement.style.opacity = '0.3'; // Visual feedback of loading
    imgElement.src = `https://archive.org/download/noorani-qaida_202104/page/n${currentPage}_w600.jpg`;
    if(pageDisplay) pageDisplay.innerText = currentPage + 1;
}

function changePage(step) {
    let nextPage = currentPage + step;
    if(nextPage >= 0 && nextPage <= totalPages) {
        currentPage = nextPage;
        updateDisplay();
    }
}

function jumpToPage(val) {
    let target = parseInt(val) - 1;
    if(target >= 0 && target <= totalPages) {
        currentPage = target;
        updateDisplay();
    }
}

imgElement.onload = () => { imgElement.style.opacity = '1'; };

// 2. LIVE TXT REPAIR (Branding: abid-khan-institute-hub)
const states = ["ENCRYPTED", "PEDAGOGY ACTIVE", "GATEWAY: OPEN", "HUB ONLINE", "ABID-KHAN-INSTITUTE-HUB"];
let stateIdx = 0;
setInterval(() => {
    if(liveTxt) {
        liveTxt.innerText = "SYSTEM: " + states[stateIdx];
        stateIdx = (stateIdx + 1) % states.length;
    }
}, 3000); 

// 3. SOVEREIGN SECURITY
document.addEventListener('contextmenu', e => e.preventDefault());
document.onkeydown = function(e) {
    if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) || (e.ctrlKey && [85, 83].includes(e.keyCode))) {
        return false;
    }
};
/* END: JavaScript Logic */
</script>
</body>
</html>
