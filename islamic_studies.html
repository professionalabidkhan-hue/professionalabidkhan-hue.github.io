<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic Studies | Professor Abid Khan Hub</title>
    
    <link rel="icon" type="image/png" href="ABID KHAN.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800&family=Amiri:wght@700&display=swap" rel="stylesheet">

    <style>
        /* START: UI Repairing (Part 6) - Global Sovereign CSS */
        :root {
            --islamic-green: #00c853;
            --dark-bg: #030407;
            --gold: #FFD700;
            --glass-white: rgba(255, 255, 255, 0.05);
        }

        body { 
            background-color: var(--dark-bg); color: #fff; 
            font-family: 'Inter', sans-serif; -webkit-user-select: none; user-select: none;
        }

        .dua-header {
            font-family: 'Amiri', serif; font-size: 2.2rem; color: var(--gold);
            padding: 20px; text-shadow: 0 0 15px rgba(255, 215, 0, 0.3); text-align: center;
        }

        .qaida-box {
            background: radial-gradient(circle, #0a1f12 0%, #030407 100%);
            border: 2px solid rgba(0, 200, 83, 0.3); border-radius: 25px; padding: 20px;
        }

        .viewer-container {
            background: #000; border-radius: 15px; 
            box-shadow: 0 0 30px rgba(0, 200, 83, 0.4);
            min-height: 400px; display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
        }

        /* UI Repair: Placeholder for Google Photos */
        .photo-placeholder {
            text-align: center; padding: 40px; display: none;
        }
        .photo-placeholder i { font-size: 5rem; color: var(--gold); margin-bottom: 20px; }

        iframe { width: 100%; height: 70vh; border-radius: 10px; border: none; }

        .mobile-scroll-row { display: flex; gap: 15px; padding: 20px 0; overflow-x: auto; }
        .col-custom-card { flex: 0 0 250px; }

        .gallery-card {
            background: var(--glass-white); border: 1px solid rgba(0, 200, 83, 0.2);
            border-radius: 20px; padding: 20px; transition: 0.4s; cursor: pointer; text-align: center;
        }
        .active-card { border-color: var(--gold); background: rgba(255, 215, 0, 0.08); }

        .android-home-btn {
            position: fixed; bottom: 20px; right: 20px; z-index: 10001;
            background: var(--gold); color: #000; width: 55px; height: 55px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; text-decoration: none;
        }
        /* END: UI Repairing (Part 6) */
    </style>
</head>
<body>

<div class="dua-header">اللَّهُمَّ إِنِّي أَسْأَلُكَ الثَّبَاتَ فِي الْأَمْرِ، وَالْعَزِيمَةَ عَلَى الرُّشْدِ</div>

<div class="container-fluid py-3">
    <div class="qaida-box mx-auto" style="max-width: 1100px;">
        <h2 id="gallery-title" class="text-center h4 fw-bold mb-3" style="font-family:'Orbitron'; color: var(--gold);">SECURE LOAD...</h2>
        
        <div class="viewer-container">
            <iframe id="ext-frame" src=""></iframe>
            
            <div id="photo-ui" class="photo-placeholder">
                <i class="fas fa-images"></i>
                <h3>Secure Google Album</h3>
                <p class="text-secondary">Google requires a direct connection to view this album.</p>
                <button class="btn btn-warning fw-bold px-5" onclick="openExternal()">OPEN GALLERY NOW</button>
            </div>
        </div>

        <div class="mt-3 text-center">
            <button id="test-btn" class="btn btn-sm btn-outline-info" onclick="toggleTestMode()">tEST Mode: OFF</button>
        </div>
    </div>

    <div class="mobile-scroll-row px-4" id="gallery-registry"></div>
</div>

<a href="#" class="android-home-btn"><i class="fas fa-home"></i></a>

<script>
/* START: Registry with your provided Google Photo Links */
const galleryData = [
    { id: 'qaeedha', title: "NOORANI QAEEDHA", type: 'google', icon: "fa-book-open", url: "https://photos.app.goo.gl/zBbpvNwCzK5T2B3b7" },
    { id: 'tajweedh', title: "TAJWEEDH GALLERY", type: 'google', icon: "fa-microphone-lines", url: "https://photos.app.goo.gl/abj74ZkQYFgY1qr7A" },
    { id: 'nimaz', title: "NIMAZ GUIDE", type: 'internal', icon: "fa-mosque", url: "https://abidkhaneinstitute.qzz.io/NIMAZ.html" },
    { id: 'prayers', title: "MASNOON DUA", type: 'internal', icon: "fa-hands-praying", url: "https://abidkhaneinstitute.qzz.io/PRAYERS.html" }
];

let activeUrl = "";

function init() {
    const reg = document.getElementById('gallery-registry');
    galleryData.forEach(item => {
        const div = document.createElement('div');
        div.className = 'col-custom-card';
        div.innerHTML = `
            <div class="gallery-card" onclick="loadContent('${item.id}', this)">
                <i class="fas ${item.icon} mb-2"></i>
                <div style="font-family:'Orbitron'; font-size:0.8rem;">${item.title}</div>
            </div>`;
        reg.appendChild(div);
    });
    loadContent(galleryData[0].id, reg.querySelector('.gallery-card'));
}

function loadContent(id, el) {
    const item = galleryData.find(x => x.id === id);
    activeUrl = item.url;
    document.getElementById('gallery-title').innerText = item.title;
    
    const frame = document.getElementById('ext-frame');
    const photoUI = document.getElementById('photo-ui');

    if(item.type === 'google') {
        frame.style.display = 'none';
        photoUI.style.display = 'block';
    } else {
        frame.style.display = 'block';
        photoUI.style.display = 'none';
        frame.src = item.url;
    }

    document.querySelectorAll('.gallery-card').forEach(c => c.classList.remove('active-card'));
    el.classList.add('active-card');
}

function openExternal() { window.open(activeUrl, '_blank'); }

function toggleTestMode() {
    const b = document.getElementById('test-btn');
    const isTest = document.body.classList.toggle('test-mode-on');
    b.innerText = isTest ? "tEST Mode: ON" : "tEST Mode: OFF";
    document.querySelector('.viewer-container').style.filter = isTest ? "blur(20px)" : "none";
}

window.onload = init;
/* END: UI Repairing JS */
</script>
</body>
</html>
