<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noorani Qaida Digital | Professor Doctor Abid Khan Hub</title>
    
    <meta name="description" content="Sovereign Islamic Pedagogy Portal managed by Professor Doctor Abid Khan.">
    <link rel="icon" type="image/png" href="ABID KHAN.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@600;800&display=swap" rel="stylesheet">

    <style>
        /* START: UI Repairing - Master Theme & Qaida Viewer CSS */
        :root {
            --primary-blue: #0b63d3;
            --islamic-green: #00c853;
            --dark-bg: #030407;
            --gold: #FFD700;
            --it-purple: #a855f7;
        }

        body { 
            background-color: var(--dark-bg); 
            color: #fff; 
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-user-select: none; user-select: none;
        }

        /* Sovereign Navigation */
        .navbar-custom {
            background: rgba(3, 4, 7, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 3px solid var(--islamic-green);
            padding: 15px 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
        }

        .nav-link { 
            color: #FFFFFF !important; 
            font-weight: 800 !important; 
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .nav-link:hover { color: var(--islamic-green) !important; transform: translateY(-2px); }

        /* Digital Qaida Viewer Logic */
        .qaida-master-wrapper {
            background: radial-gradient(circle at center, #0a1f12 0%, #030407 100%);
            border: 2px solid rgba(0, 200, 83, 0.2);
            border-radius: 30px;
            padding: 40px 20px;
            margin: 40px auto;
            max-width: 900px;
            box-shadow: 0 0 50px rgba(0, 200, 83, 0.1);
        }

        .book-container {
            background: #fff;
            border: 12px solid #1a1a1a;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
        }

        .qaida-img {
            width: 100%;
            height: auto;
            max-height: 750px;
            object-fit: contain;
            transition: opacity 0.4s ease;
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 200, 83, 0.85);
            color: white;
            border: none;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .nav-arrow:hover { background: var(--gold); color: #000; transform: translateY(-50%) scale(1.1); }
        .arrow-left { left: 15px; }
        .arrow-right { right: 15px; }

        .status-bar {
            background: rgba(0,0,0,0.9);
            padding: 15px;
            border-radius: 0 0 20px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #333;
        }

        /* END: UI Repairing - Master Theme & Qaida Viewer CSS */
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="#">
            <img src="ABID KHAN.png" width="50" height="50" class="rounded-circle me-3" style="border: 2px solid var(--gold);">
            <span style="font-family:'Orbitron'; font-weight:900;">ABID KHAN HUB</span>
        </a>
        <div id="live-txt" class="ms-auto text-success fw-bold d-none d-md-block" style="font-family:'Orbitron'; font-size: 0.75rem;">
            SYSTEM: ENCRYPTED
        </div>
    </div>
</nav>
<div class="container">
    <div class="qaida-master-wrapper">
        <div class="text-center mb-4">
            <h2 style="font-family:'Orbitron'; color: var(--gold); letter-spacing: 3px;">NOORANI QAIDA</h2>
            <p class="text-secondary small">Click arrows or use keyboard to change pages</p>
        </div>

        <div class="book-container">
            <button class="nav-arrow arrow-left" onclick="prevPage()"><i class="fas fa-chevron-left"></i></button>
            <button class="nav-arrow arrow-right" onclick="nextPage()"><i class="fas fa-chevron-right"></i></button>
            
            <img id="qaida-frame" src="https://archive.org/download/noorani-qaida_202104/page/n0_w500.jpg" class="qaida-img">
            
            <div class="status-bar">
                <div style="font-family:'Orbitron'; color: var(--islamic-green); font-size: 0.9rem;">
                    PAGE: <span id="page-indicator">1</span> / 32
                </div>
                <div id="qaida-live-txt" class="small text-warning fw-bold">SESSION: ACTIVE</div>
                <button class="btn btn-sm btn-outline-light" onclick="resetBook()">RESTART</button>
            </div>
        </div>

        <div class="mt-5 row text-center g-4">
            <div class="col-md-4">
                <div class="p-3 border border-secondary rounded-3">
                    <i class="fas fa-shield-halved text-success mb-2"></i>
                    <h6>Secure Pedagogy</h6>
                </div>
            </div>
            <div class="col-md-4">
                <div class="p-3 border border-secondary rounded-3">
                    <i class="fas fa-Sync text-success mb-2"></i>
                    <h6>Live Archives</h6>
                </div>
            </div>
            <div class="col-md-4">
                <div class="p-3 border border-secondary rounded-3">
                    <i class="fas fa-graduation-cap text-success mb-2"></i>
                    <h6>Elite Certification</h6>
                </div>
            </div>
        </div>
    </div>
</div>
<footer class="py-4 text-center border-top border-secondary mt-5">
    <p class="small text-secondary mb-0">&copy; 2026 Abid Khan Hub | Developed by abid-pedagogy-db</p>
</footer>

<script>
    let currentIdx = 0;
    const totalPages = 31;

    // Digital Viewer Logic
    function updatePage() {
        const frame = document.getElementById('qaida-frame');
        const indicator = document.getElementById('page-indicator');
        
        frame.style.opacity = '0.3';
        
        setTimeout(() => {
            frame.src = `https://archive.org/download/noorani-qaida_202104/page/n${currentIdx}_w700.jpg`;
            indicator.innerText = currentIdx + 1;
            frame.style.opacity = '1';
        }, 250);
    }

    function nextPage() { if(currentIdx < totalPages) { currentIdx++; updatePage(); } }
    function prevPage() { if(currentIdx > 0) { currentIdx--; updatePage(); } }
    function resetBook() { currentIdx = 0; updatePage(); }

    // Keyboard Support
    document.addEventListener('keydown', (e) => {
        if(e.key === "ArrowRight") nextPage();
        if(e.key === "ArrowLeft") prevPage();
    });

    // LIVE TXT LOGIC
    const liveDiv = document.getElementById('live-txt');
    const qaidaLive = document.getElementById('qaida-live-txt');
    const systemStatus = ["ENCRYPTED", "SYNCING", "SOVEREIGN", "ACTIVE"];
    let sIdx = 0;

    setInterval(() => {
        liveDiv.innerText = "SYSTEM: " + systemStatus[sIdx];
        qaidaLive.innerText = "SESSION: " + systemStatus[sIdx];
        sIdx = (sIdx + 1) % systemStatus.length;
    }, 4000);

    // Sovereign Security (Anti-Inspection)
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = function(e) {
        if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) || (e.ctrlKey && [85, 83].includes(e.keyCode))) return false;
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
