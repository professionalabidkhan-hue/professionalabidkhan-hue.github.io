<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic Studies | Professor Abid Khan Hub</title>
    
    <link rel="icon" type="image/png" href="ABID KHAN.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800&family=Amiri:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --islamic-green: #00c853;
            --dark-bg: #030407;
            --gold: #FFD700;
            --cyber-cyan: #00d4ff;
            --glass-white: rgba(255, 255, 255, 0.05);
        }

        body { 
            background-color: var(--dark-bg); color: #fff; 
            font-family: 'Inter', sans-serif; -webkit-user-select: none; user-select: none;
            overflow-x: hidden; margin: 0; padding: 0;
        }

        /* Dua Header - Custom Font Requirement */
        .dua-header {
            font-size: clamp(1.8rem, 5vw, 3rem);
            text-align: center;
            padding: 25px 10px;
            color: var(--gold);
            font-family: 'Amiri', serif;
            animation: glow 2s ease-in-out infinite alternate;
            direction: rtl;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
            to { text-shadow: 0 0 20px rgba(255, 215, 0, 0.7); }
        }

        .navbar-custom {
            background: rgba(3, 4, 7, 0.98); border-bottom: 3px solid var(--islamic-green);
            padding: 10px 0; backdrop-filter: blur(10px);
        }

        .qaida-box {
            background: radial-gradient(circle, #0a1f12 0%, #030407 100%);
            border: 2px solid rgba(0, 200, 83, 0.3); border-radius: 25px; padding: 20px; margin-top: 15px;
        }

        .live-txt-indicator {
            color: var(--cyber-cyan); font-family: 'Orbitron'; font-size: 0.7rem; letter-spacing: 2px;
        }

        .viewer-container {
            background: #000; padding: 5px; border-radius: 15px; 
            box-shadow: 0 0 30px rgba(0, 200, 83, 0.4);
            overflow: hidden; margin-bottom: 20px;
        }

        iframe { width: 100%; border-radius: 10px; min-height: 500px; height: 70vh; transition: 0.4s; }

        /* Gallery Cards - Repairing UI Stacking */
        .mobile-scroll-row {
            display: flex; gap: 15px; padding: 20px 0;
        }

        @media (max-width: 991px) {
            .mobile-scroll-row {
                flex-direction: column; /* Part 6 Vertical Stack */
                padding: 15px;
            }
            .col-custom-card { width: 100%; }
            .gallery-card {
                display: flex !important; align-items: center; text-align: left !important;
                padding: 15px;
            }
            .gallery-card i { margin-bottom: 0 !important; margin-right: 15px; font-size: 1.5rem; }
        }

        @media (min-width: 992px) {
            .mobile-scroll-row { flex-wrap: wrap; justify-content: center; }
            .col-custom-card { flex: 0 0 calc(20% - 15px); }
        }

        .gallery-card {
            background: var(--glass-white); border: 1px solid rgba(0, 200, 83, 0.2);
            border-radius: 20px; padding: 20px; transition: 0.4s; cursor: pointer; text-align: center;
        }

        .active-card { border-color: var(--gold); background: rgba(255, 215, 0, 0.08); }

        .card-title { font-family: 'Orbitron'; color: #fff; font-size: 0.85rem; margin-top: 5px; }

        .android-home-btn {
            position: fixed; bottom: 20px; right: 20px; z-index: 10001;
            background: linear-gradient(135deg, var(--gold), #b8860b);
            color: #000; width: 55px; height: 55px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; border: 2px solid #fff;
        }
    </style>
    </head>

<body oncontextmenu="return false;">

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
            <img src="ABID KHAN.png" width="50" height="50" class="rounded-circle me-2" style="border: 2px solid var(--gold);">
            <span class="fw-bold" style="font-family:'Orbitron'">ABID KHAN E-INSTITUTE</span>
        </a>
        <div class="ms-auto">
            <a href="IT.html" class="btn btn-outline-info btn-sm">IT LAB</a>
        </div>
    </div>
</nav>

<div class="container-fluid py-3 text-center">
    <div class="qaida-box mx-auto" style="max-width: 1100px;">
        <div class="live-txt-indicator mb-2"><i class="fas fa-bolt"></i> LIVE TXT ACTIVE</div>
        <h2 id="gallery-title" class="h4 fw-bold mb-3" style="font-family:'Orbitron'; color: var(--gold);">SECURE LOAD...</h2>
        
        <div id="viewer-window" class="viewer-container">
            <iframe id="ext-frame" src="" frameborder="0" allowfullscreen></iframe>
        </div>

        <div class="mt-2 d-flex justify-content-center gap-3">
            <button id="test-btn" class="btn btn-sm btn-outline-info px-4" onclick="toggleTestMode()" style="font-family:'Orbitron'; font-size: 0.6rem;">tEST Mode: OFF</button>
        </div>
    </div>

    <div class="container">
        <div class="mobile-scroll-row" id="gallery-registry"></div>
    </div>
</div>

<footer class="footer-elite text-center py-4 mt-5" style="background:#000; border-top: 2px solid var(--islamic-green);">
    <div class="container">
        <p class="small text-secondary">Worker Auth: abid-khan-institute-hub</p>
        <div class="text-gold" style="font-family:'Orbitron'; font-size: 0.7rem;">© 2026 PROFESSOR DR. ABID KHAN</div>
    </div>
</footer>

<a href="https://abidkhaneinstitute.qzz.io/index.html" class="android-home-btn"><i class="fas fa-home"></i></a>

<script>
/* START: Part 2 Dynamic Registry Data */
const galleryData = [
    { id: 'qaeedha', title: "NOORANI QAEEDHA", icon: "fa-book-open", desc: "Interactive Qaeedha", url: "https://archive.org/embed/noorani_qaida_202010" },
    { id: 'tajweedh', title: "TAJWEEDH RULES", icon: "fa-microphone-lines", desc: "Rules of Recitation", url: "https://archive.org/embed/tajweedrules-100517214532-phpapp01" },
    { id: 'nimaz', title: "NIMAZ GUIDE", icon: "fa-mosque", desc: "Visual Salah Steps", url: "https://abidkhaneinstitute.qzz.io/NIMAZ.html" },
    { id: 'prayers', title: "MASNOON DUA", icon: "fa-hands-praying", desc: "Daily Supplications", url: "https://abidkhaneinstitute.qzz.io/PRAYERS.html" },
    { id: 'vocal', title: "TAJWEEDH VOCAL", icon: "fa-volume-high", desc: "Audio Integration", url: "https://abidkhaneinstitute.qzz.io/BASICSTAJWEEDHVOCALS.html" }
];
/* END: Part 2 Dynamic Registry Data */

/* START: Part 6 LIVE TXT & UI Logic */
function initGallery() {
    const registry = document.getElementById('gallery-registry');
    registry.innerHTML = "";
    galleryData.forEach(item => {
        const cardCol = document.createElement('div');
        cardCol.className = 'col-custom-card';
        cardCol.innerHTML = `
            <div class="gallery-card" onclick="loadContent('${item.id}', this)">
                <i class="fas ${item.icon}"></i>
                <div>
                    <div class="card-title">${item.title}</div>
                    <p class="text-secondary mb-0" style="font-size:0.6rem;">${item.desc}</p>
                </div>
            </div>
        `;
        registry.appendChild(cardCol);
    });
    loadContent(galleryData[0].id, registry.querySelector('.gallery-card'));
}

function loadContent(id, element) {
    const data = galleryData.find(x => x.id === id);
    document.getElementById('gallery-title').innerText = data.title;
    const frame = document.getElementById('ext-frame');
    frame.style.opacity = "0";
    setTimeout(() => { frame.src = data.url; frame.style.opacity = "1"; }, 300);
    document.querySelectorAll('.gallery-card').forEach(c => c.classList.remove('active-card'));
    if(element) element.classList.add('active-card');
    console.log("LIVE TXT: Synced with abid-pedagogy-db for " + id);
}

function toggleTestMode() {
    const b = document.getElementById('test-btn');
    document.body.classList.toggle('test-mode-on');
    const isTest = document.body.classList.contains('test-mode-on');
    b.innerText = isTest ? "tEST Mode: ON" : "tEST Mode: OFF";
    b.classList.toggle('btn-outline-danger', isTest);
    document.getElementById('ext-frame').style.filter = isTest ? "blur(15px) brightness(0.5)" : "none";
}

window.onload = initGallery;
/* END: Part 6 UI Repairing */
</script>
</body>
</html>
