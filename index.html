<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abid Khan Institute Hub | Elite Pedagogy</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root { --emerald: #1a5d1a; --gold: #d4af37; --bg-glass: rgba(255, 255, 255, 0.9); }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: #f4f7f6; 
            color: #333; 
            /* Security: Blocks Copy/Paste & Dragging */
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            overflow-x: hidden;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        .orbitron { font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }

        /* Placeholder heights to prevent layout jump during Header/Footer Fetch */
        #header { min-height: 80px; }
        #footer { min-height: 200px; }

        /* Tremendous Card System */
        .tremendous-card {
            border: none; 
            border-radius: 25px;
            background: #ffffff;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            pointer-events: auto;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .tremendous-card:hover {
            transform: translateY(-15px);
            box-shadow: 0 25px 50px rgba(26, 93, 26, 0.15);
            border-bottom: 6px solid var(--gold);
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: #f8f9fa;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            transition: 0.3s;
        }

        .tremendous-card:hover .icon-box {
            background: var(--emerald);
            color: white !important;
        }

        /* Hero Text Styling */
        .hero-title { font-size: 3.5rem; color: var(--emerald); }
    </style>
    </head>
<body>

    <div id="header"></div>
    <main class="container py-5">
        <div class="text-center mb-5 mt-4">
            <h1 class="hero-title orbitron fw-bold">INSTITUTE HUB</h1>
            <p class="lead fw-semibold text-secondary">Elite Pedagogy Platform & Secure Digital Architecture</p>
            <span class="badge rounded-pill bg-dark px-3 py-2">Worker: abid-khan-institute-hub</span>
        </div>

        <div class="row g-4 text-center mt-2">
            <div class="col-md-4">
                <div class="card tremendous-card p-5" onclick="location.href='islamic_studies.html'">
                    <div class="icon-box text-success">
                        <i class="fas fa-book-quran fa-3x"></i>
                    </div>
                    <h3 class="orbitron fw-bold">ISLAMIC STUDIES</h3>
                    <p class="text-muted small">Tajweed, Noorani Qaedha & Daily Duas Mastery</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card tremendous-card p-5" onclick="location.href='security_hub.html'">
                    <div class="icon-box text-primary">
                        <i class="fas fa-user-shield fa-3x"></i>
                    </div>
                    <h3 class="orbitron fw-bold">SECURITY HUB</h3>
                    <p class="text-muted small">Alphanumeric OTP & Yearly DB Architecture</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card tremendous-card p-5" onclick="location.href='pedagogy.html'">
                    <div class="icon-box text-warning">
                        <i class="fas fa-database fa-3x"></i>
                    </div>
                    <h3 class="orbitron fw-bold">PEDAGOGY DB</h3>
                    <p class="text-muted small">Worker: abid-pedagogy-db Login & Data Management</p>
                </div>
            </div>
        </div>
    </main>

    <div id="footer"></div>
    <script>
        (function() {
            // 1. Dynamic Injection Logic for Header & Footer
            async function materializeHub() {
                const parts = ['header', 'footer'];
                for (const part of parts) {
                    try {
                        const response = await fetch(`${part}.html`);
                        if (response.ok) {
                            document.getElementById(part).innerHTML = await response.text();
                            console.log(`[Materialized]: ${part}`);
                        }
                    } catch (e) { console.error("Component failed to load"); }
                }
            }

            // 2. Elite Anti-Inspect & Anti-Copy Protection
            document.addEventListener('contextmenu', e => e.preventDefault());
            
            window.addEventListener('keydown', e => {
                // Block F12, Ctrl+U, Ctrl+Shift+I/J/C
                if (e.keyCode === 123 || 
                    (e.ctrlKey && e.keyCode === 85) || 
                    (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode))) {
                    e.preventDefault();
                    return false;
                }
            });

            // Prevent image dragging globally
            document.addEventListener('dragstart', e => e.preventDefault());

            document.addEventListener("DOMContentLoaded", materializeHub);
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
