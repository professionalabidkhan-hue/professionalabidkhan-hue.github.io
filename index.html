<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professor Doctor Abid Khan | Pedagogy Institute & Security Hub</title>
    
    <meta name="description" content="The official elite platform of Professor Doctor Abid Khan. Global expert in Pedagogy and secure Alphanumeric systems.">
    <link rel="icon" type="image/png" href="ABID KHAN.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #0b63d3;
            --cyber-cyan: #00d4ff;
            --it-purple: #a855f7;
            --dark-bg: #030407;
            --gold: #FFD700;
            --islamic-green: #10b981;
        }

        body { 
            background-color: var(--dark-bg); 
            color: #fff; 
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-user-select: none; user-select: none;
        }

        .hero-title {
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, var(--primary-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: clamp(2rem, 8vw, 4rem);
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 25px;
            transition: 0.4s;
            height: 100%;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: var(--primary-blue);
            box-shadow: 0 10px 30px rgba(11, 99, 211, 0.3);
        }

        .ai-status {
            position: fixed; bottom: 20px; right: 20px;
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            padding: 10px 20px; border-radius: 50px;
            font-size: 12px; font-family: 'Orbitron';
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <section class="container text-center pt-5">
        <div class="py-5">
            <h1 class="hero-title text-uppercase">Abid Khan E-Pedagogy Hub</h1>
            <p class="lead text-secondary">The sovereign gateway for secure systems and spiritual excellence.</p>
            <div class="mt-4">
                <a href="https://abid-pedagogy-db.abidkhanpedagogyinstitute.workers.dev/" class="btn btn-primary btn-lg px-5">Access Portal</a>
                <a href="https://abidkhaneinstitute.qzz.io/it_panel.html" class="btn btn-outline-info btn-lg ms-3">IT Panel</a>
            </div>
        </div>
    </section>

    <section class="container mb-5">
        <div class="row g-4">
            <div class="col-md-3">
                <div class="card p-3 text-center">
                    <i class="fas fa-terminal fa-3x mb-3" style="color:var(--it-purple)"></i>
                    <h4 style="font-family: 'Orbitron'">IT Lab</h4>
                    <a href="IT.html" class="btn btn-sm btn-outline-light mt-2">Enter Lab</a>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 text-center">
                    <i class="fas fa-mosque fa-3x mb-3" style="color:var(--islamic-green)"></i>
                    <h4>Madrasa</h4>
                    <a href="islamic_studies.html" class="btn btn-sm btn-outline-light mt-2">Enter Madrasa</a>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 text-center">
                    <i class="fas fa-briefcase fa-3x mb-3"></i>
                    <h4>Careers</h4>
                    <a href="jobs.html" class="btn btn-sm btn-outline-light mt-2">View Jobs</a>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 text-center" style="border: 1px solid var(--gold);">
                    <i class="fas fa-microchip fa-3x mb-3" style="color:var(--gold)"></i>
                    <h4 style="color:var(--gold)">Admin Panel</h4>
                    <a href="https://abidkhaneinstitute.qzz.io/it_panel.html" class="btn btn-sm btn-warning mt-2">Open IT Panel</a>
                </div>
            </div>
        </div>
    </section>

    <div class="ai-status">
        <span class="text-success">●</span> SYSTEM ONLINE: BYPASS ACTIVE
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load Header and Footer
        function loadComponent(id, file) {
            fetch(file)
                .then(response => response.text())
                .then(data => { document.getElementById(id).innerHTML = data; })
                .catch(err => console.error("Error loading component:", err));
        }
        loadComponent("header-placeholder", "header.html");
        loadComponent("footer-placeholder", "footer.html");
    </script>
    <script src="security.js"></script>
</body>
</html>
