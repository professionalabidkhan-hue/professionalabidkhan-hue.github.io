    { title: "Tashahhud", pos: "Posture 8: Sitting", arabic: "التَّحِيَّاتُ لِلَّهِ وَالصَّلَواتُ وَالطَّيِّباتُ، السَّلامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكاتُهُ، السَّلامُ عَلَيْنا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ، أَشْهَدُ أَنْ لا إِلَهَ إِلا اللَّهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ", eng: "All prayers and worship through words, action and sanctity are for Allah only. Peace be on you, O Prophet, and Mercy of Allah and His blessings. Peace be on us and on those who are righteous servants of Allah. I bear witness that there is no deity but Allah, and Muhammad is His slave and messenger.", urdu: "تمام قولی، فعلی اور مالی عبادتیں اللہ ہی کے لئے ہیں۔ سلام ہو آپ پر اے نبی اور اللہ کی رحمتیں اور برکتیں۔ سلام ہو ہم پر اور اللہ کے نیک بندوں پر۔ میں گواہی دیتا ہوں کہ اللہ کے سوا کوئی معبود نہیں اور محمد ﷺ اس کے بندے اور رسول ہیں۔" },
    { title: "Durood Ibrahim", pos: "Posture 8: Sitting", arabic: "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ ۔ اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ", eng: "O Allah, exalt Muhammad and the followers of Muhammad as Thou did exalt Ibrahim and his followers. Thou art the Praised, the Glorious. O Allah, bless Muhammad and his followers as Thou has blest Ibrahim and his followers. Thou art the Praised, the Glorious.", urdu: "اے اللہ! حضرت محمد ﷺ اور ان کی آل پر رحمت نازل فرما جس طرح تو نے ابراہیم علیہ السلام اور ان کی آل پر رحمت نازل کی۔ بیشک تو تعریف کے لائق اور بڑی شان والا ہے۔ اے اللہ! حضرت محمد ﷺ اور ان کی آل پر برکت نازل فرما جس طرح تو نے ابراہیم علیہ السلام اور ان کی آل پر برکت نازل کی۔" },

    { title: "Salam (Right)", pos: "Posture 9: Finish", arabic: "السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ", eng: "Peace be on you and Allah's blessings. (Turn your face to the right).", urdu: "تم پر سلامتی ہو اور اللہ کی رحمت (دائیں طرف منہ پھیریں)" },

];

function initRegistry() {
    const reg = document.getElementById('registry');
    nimazVault.forEach((step, i) => {
        const btn = document.createElement('button');
        btn.className = 'dua-btn';
        btn.innerHTML = `<span class="num">${i + 1}</span> <span>${step.title.toUpperCase()}</span>`;
        btn.onclick = () => loadStep(i, btn);
        reg.appendChild(btn);
    });
    loadStep(0, reg.firstChild);
}

function loadStep(i, btn) {
    const data = nimazVault[i];
    document.querySelectorAll('.dua-btn').forEach(b => b.classList.remove('active-step'));
    btn.classList.add('active-step');
    
    document.getElementById('posture-hint').innerText = data.pos;
    document.getElementById('arabic-display').innerText = data.arabic;
    document.getElementById('english-display').innerText = data.eng;
    document.getElementById('urdu-display').innerText = data.urdu;
    
    toggleTestMode();
}

function toggleTestMode() {
    const isTest = document.getElementById('testModeToggle').checked;
    const transParent = document.getElementById('trans-parent');
    if (isTest) {
        transParent.classList.add('hidden-for-test');
    } else {
        transParent.classList.remove('hidden-for-test');
    }
}

window.onload = initRegistry;
</script>
