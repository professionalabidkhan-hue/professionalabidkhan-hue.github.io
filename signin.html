<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Professor Doctor Abid Khan | Secure Vault Access</title>
  
  <meta name="description" content="Login gateway for Professor Doctor Abid Khan Hub.">
  <meta name="author" content="Professor Doctor Abid Khan">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { background: #07090d; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
    .master-input { background: rgba(0,0,0,0.5); border: 1px solid #1a1c2c; color: white; border-radius: 12px; padding: 12px; margin-bottom: 15px; width: 100%; transition: 0.3s; }
    .master-input:focus { border-color: #4fc3f7; outline: none; box-shadow: 0 0 10px rgba(79, 195, 247, 0.3); }
    .master-avatar { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #4fc3f7; object-fit: cover; padding: 5px; background: rgba(79, 195, 247, 0.1); }
    .btn-sentinel { background: #4fc3f7; color: black; font-weight: bold; border-radius: 15px; padding: 18px; width: 100%; border: none; transition: 0.3s; opacity: 0.3; cursor: not-allowed; text-transform: uppercase; }
    .btn-active { opacity: 1 !important; cursor: pointer !important; box-shadow: 0 5px 20px rgba(79, 195, 247, 0.4); }
    .animate__animated { animation-duration: 0.5s; animation-fill-mode: both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shakeX { from, to { transform: translate3d(0, 0, 0); } 10%,30%,50%,70%,90% { transform: translate3d(-5px,0,0); } 20%,40%,60%,80% { transform: translate3d(5px,0,0); } }
    .animate__fadeIn { animation-name: fadeIn; }
    .animate__shakeX { animation-name: shakeX; }
  </style>
</head>
<body>

<div class="container py-5">
  <div class="mx-auto" style="max-width: 500px; background: #0d1117; padding: 45px; border-radius: 35px; border: 1px solid #1a1c2c; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
    
    <div class="text-center mb-4">
      <img src="ABID KHAN.png" alt="Professor Doctor Master Abid Khan" class="master-avatar shadow-lg">
    </div>     
    
    <h2 class="text-center fw-bold mb-4" style="letter-spacing: 2px;">VAULT ACCESS</h2>

    <form id="signinForm">
      <input type="email" id="email" class="master-input" placeholder="Email Address" required>
      <input type="password" id="password" class="master-input" placeholder="Access Key" required>

      <div class="form-check mb-4 mt-2">
        <input type="checkbox" id="agree" class="form-check-input" onchange="toggleButton()">
        <label for="agree" class="small text-secondary">I accept the Hub Rules</label>
      </div>

      <div id="statusMessage" class="mt-3 p-2 text-center d-none" style="border-radius: 8px;"></div>
      <button type="submit" id="submitBtn" class="btn-sentinel" disabled>OPEN VAULT</button>
    </form>

    <div class="mt-3 text-center">
      <a href="forgot_password.html" class="text-secondary small">Forgot Access Key?</a> |
      <a href="signup.html" class="text-secondary small">New Identity? Register</a>
    </div>
  </div>
</div>

<script>
const API_BASE = "https://miniature-sniffle-4jp95g6rxr673jj7v-3000.app.github.dev";

function toggleButton() {
  const isChecked = document.getElementById('agree').checked;
  const btn = document.getElementById('submitBtn');
  if (isChecked) {
    btn.disabled = false;
    btn.classList.add("btn-active");
  } else {
    btn.disabled = true;
    btn.classList.remove("btn-active");
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('signinForm');
  const status = document.getElementById('statusMessage');
  const btn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const data = {
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    };

    try {
      btn.innerHTML = "⏳ Authenticating...";
      btn.disabled = true;

      const res = await fetch(`${API_BASE}/api/signin`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      const json = await res.json();

      status.classList.remove("d-none");
      if (json.success) {
        status.innerHTML = "✅ Access Granted";
        status.classList.add("animate__animated", "animate__fadeIn");
        status.style.background = "#0f5132";
        status.style.color = "white";

        // Redirect based on role
        if (json.user.role === "trainer") {
          setTimeout(() => { window.location.href = "TRAINERBOARD.html"; }, 1500);
        } else {
          setTimeout(() => { window.location.href = "STUDENTSDASHBOARD.html"; }, 1500);
        }
      } else {
        status.innerHTML = "❌ Error: " + json.error;
        status.classList.add("animate__animated", "animate__shakeX");
        status.style.background = "#842029";
        status.style.color = "white";
      }

    } catch (err) {
      console.error("Signin Error:", err);
      status.classList.remove("d-none");
      status.innerHTML = "❌ Network Error: Could not reach backend";
      status.classList.add("animate__animated", "animate__shakeX");
      status.style.background = "#842029";
      status.style.color = "white";
    } finally {
      btn.innerHTML = "OPEN VAULT";
      btn.disabled = false;
    }
  });
});
</script>
</body>
</html>
