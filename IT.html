<!doctype html>
<html lang="en">
<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IT Panel | Abid Khan Pedagogy Institute</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --it-purple: #a855f7;
            --neon-blue: #0ea5e9;
            --neon-green: #00ff00;
            --dark-bg: #0a0b10;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg);
            color: #ffffff;
            background: radial-gradient(circle at 50% 50%, #161827 0%, #0a0b10 100%);
            min-height: 100vh;
        }

        /* Navbar Repair */
        .navigation-header { 
            padding: 20px; 
            background: rgba(0,0,0,0.4); 
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(168, 85, 247, 0.2); 
            display: flex; 
            justify-content: space-between;
            align-items: center;
        }

        .home-link-btn {
            text-decoration: none;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            border: 1px solid var(--neon-blue);
            padding: 8px 15px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .home-link-btn:hover {
            background: var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
            color: #000;
        }

        .hero-header {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 4px;
            background: linear-gradient(to right, #fff, var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Course Card Styling */
        .it-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 24px;
            padding: 45px 20px;
            text-decoration: none !important;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .it-btn:hover {
            background: rgba(168, 85, 247, 0.08);
            border-color: var(--it-purple);
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(168, 85, 247, 0.2);
        }

        .it-btn i {
            font-size: 3.5rem;
            color: var(--it-purple);
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.4));
        }

        .course-title-master {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.15rem;
            text-align: center;
            text-transform: uppercase;
        }

        .duration-badge {
            background: var(--it-purple) !important;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem !important;
            padding: 8px 12px !important;
            border-radius: 0 0 0 15px !important;
        }

        /* UI Repair: Master Chief Launcher */
        #ai-launcher {
            position: fixed; bottom: 20px; right: 20px; 
            width: 80px; height: 80px; background: #000; 
            border: 2px solid var(--neon-green); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; z-index: 10000;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.3; } }
    </style>
</head>
<body>

<div class="navigation-header">
    <a href="index.html" class="home-link-btn">🏠 Back to Institute</a>
    <div class="status-indicator">

    </div>
</div>

<div class="container mt-5">
    <div class="row align-items-center mb-5">
        <div class="col-md-8">
            <h1 class="hero-header fw-bold text-uppercase display-5">Technical Excellence Laboratory</h1>
            <p class="text-secondary fs-5">Secure Module Selection: Deploy your learning path.</p>
        </div>
        
        <div class="col-md-4 mt-4 mt-md-0">
            <div class="p-4 rounded border border-info bg-dark text-center shadow-lg" style="background: rgba(0,0,0,0.6) !important;">
                <small class="text-info fw-bold text-uppercase" style="letter-spacing: 2px;">Global Active Nodes</small>
                <h1 class="text-white fw-bold display-4 mb-0">38</h1>
                <span class="badge bg-info p-2 mt-2">ENCRYPTION: ACTIVE</span>
            </div>
        </div>
    </div>

    <div class="row g-4 mb-5">
        <div class="col-12 col-md-6 col-lg-4">
            <a href="courses/ms_office.html" class="it-btn">
                <span class="badge position-absolute top-0 end-0 m-0 duration-badge">3 MONTHS</span>
                <i class="fas fa-file-word"></i>
                <span class="course-title-master">MS Office</span>
            </a>
        </div>
        </div>
</div>

<div id="ai-launcher" onclick="alert('Neural Link Initiated...')">
    <div id="launcher-inner" style="text-align:center">
        <span style="font-size:11px; color:var(--neon-green); font-weight:bold; font-family:'Orbitron'">MASTER<br>CHIEF</span>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
